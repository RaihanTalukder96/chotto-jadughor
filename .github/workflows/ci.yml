name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chotto
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: chotto
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U chotto" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://chotto:ci-only-password@localhost:5432/chotto
      TEST_DATABASE_URL: postgresql://chotto:ci-only-password@localhost:5432/chotto
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run db:seed
        env:
          ENABLE_DEMO_SEED: 'true'
      - run: npm run test:e2e
